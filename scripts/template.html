<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYS2 文件釋出追蹤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F8FB; --sheet:#FFFFFF; --ink:#1C2733; --ink-2:#4F5E6E; --line:#D5DEE8; --grid:#E8EEF5;
  --blue:#2457A6; --blue-soft:#E3ECF8; --amber:#C98A0B; --amber-soft:#FFF3D6;
  --green:#2F7D5B; --green-soft:#E1F1E8; --grey:#8A97A6; --grey-soft:#EEF1F4;
  --sans:"Barlow","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Noto Sans TC","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111A24; --sheet:#17222E; --ink:#E4EBF2; --ink-2:#A3B1C0; --line:#2B3A4A; --grid:#1E2B38;
    --blue:#7FA8E8; --blue-soft:#1D3150; --amber:#F2B640; --amber-soft:#3A2D10;
    --green:#6CC59B; --green-soft:#183326; --grey:#7D8B99; --grey-soft:#222E3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111A24; --sheet:#17222E; --ink:#E4EBF2; --ink-2:#A3B1C0; --line:#2B3A4A; --grid:#1E2B38;
  --blue:#7FA8E8; --blue-soft:#1D3150; --amber:#F2B640; --amber-soft:#3A2D10;
  --green:#6CC59B; --green-soft:#183326; --grey:#7D8B99; --grey-soft:#222E3A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}

/* title block, drawn like the title block of an engineering drawing */
.title{display:grid;grid-template-columns:1fr auto;gap:0;border:2px solid var(--ink);background:var(--sheet)}
.title h1{margin:0;padding:14px 18px;font:700 34px/1.1 var(--cond);letter-spacing:.01em;border-right:2px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;font:600 14px/1 var(--cond);flex:none}
.lang button{font:inherit;border:0;background:var(--sheet);color:var(--ink);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.title .meta{display:grid;grid-template-columns:auto auto;font-size:13px}
.title .meta div{padding:4px 12px;border-bottom:1px solid var(--line)}
.title .meta div:nth-child(odd){color:var(--ink-2);border-right:1px solid var(--line)}
.title .meta div:nth-last-child(-n+2){border-bottom:0}

.tabs{display:flex;gap:0;margin:22px 0 0;border-bottom:2px solid var(--ink)}
.tabs a{font:700 18px/1 var(--cond);color:var(--ink-2);padding:12px 18px 10px;border:2px solid transparent;border-bottom:0;margin-bottom:-2px;text-decoration:none}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--sheet);border-color:var(--ink);border-bottom:2px solid var(--sheet)}
.tabs a span{font:500 14px var(--sans);margin-left:6px;color:var(--ink-2)}
[hidden]{display:none !important}
.period{display:flex;gap:8px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.period span{color:var(--ink-2);font-size:14px;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--sheet)}
.seg button{font:600 15px var(--cond);border:0;background:none;color:var(--ink);padding:6px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

.headline{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:end;margin:6px 0 28px}
.headline p{margin:0;font:600 clamp(26px,3.4vw,40px)/1.2 var(--cond);max-width:24em}
.headline p .n{display:inline-block;min-width:1ch;padding:0 .18em;border-bottom:4px solid var(--amber)}
.headline small{display:block;margin-top:8px;font:400 15px/1.5 var(--sans);color:var(--ink-2)}
.spark{background:var(--sheet);border:1px solid var(--line);padding:10px 12px 6px}
.spark figcaption{font-size:12px;color:var(--ink-2);margin-bottom:4px}
.spark svg{display:block;width:100%;height:80px}
.spark .bar{fill:var(--blue)} .spark .bar.in{fill:var(--amber)}
.spark text{font:11px var(--sans);fill:var(--ink-2)}

h2{font:700 24px/1.2 var(--cond);margin:34px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 .count{font:500 15px var(--sans);color:var(--ink-2)}

/* feed */
.feed{background:var(--sheet);border:1px solid var(--line)}
.day{display:grid;grid-template-columns:118px minmax(0,1fr);border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day > time{padding:12px 14px;font:600 17px/1.2 var(--cond);border-right:1px solid var(--line);color:var(--ink-2)}
.day > time b{display:block;color:var(--ink);font-size:22px}
.items{min-width:0}
.item{padding:10px 14px;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.item:last-child{border-bottom:0}
.item .what{min-width:0}
.item .what a.k{font-weight:600}
.item .sub{color:var(--ink-2);font-size:13px}
.item ul{margin:4px 0 0;padding:0;list-style:none;font-size:13px}
.item li{overflow-wrap:anywhere;padding-left:18px;position:relative}
.item li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:10px;border:1.5px solid var(--ink-2);border-radius:1px}
.item li.fresh::before{border-color:var(--amber);background:var(--amber-soft)}
.empty{padding:22px 16px;color:var(--ink-2)}

/* BL stamp */
.bl{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:26px;padding:0 6px;
  font:700 15px/1 var(--cond);border:1.5px solid currentColor;border-radius:3px;white-space:nowrap;cursor:default}
.bl.open{color:var(--blue);background:var(--blue-soft)}
.bl.done{color:var(--green);background:var(--green-soft)}
.bl.drop{color:var(--grey);background:var(--grey-soft);text-decoration:line-through}
.bl.new{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--amber)}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2);background:var(--paper)}
.pill.open{color:var(--blue);border-color:var(--blue)}
.pill.done{color:var(--green);border-color:var(--green)}

/* table */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.controls input[type=search],.controls select{font:15px var(--sans);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.controls input[type=search]{flex:1 1 260px}
.types{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sheet)}
.types button{font:600 14px var(--cond);border:0;background:none;color:var(--ink-2);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.types button:last-child{border-right:0}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.types button span{font-weight:500;opacity:.75;margin-left:4px}
.doc{display:inline-block;font:700 13px/1 var(--cond);padding:3px 6px;border-radius:3px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.doc.CFTS{color:#fff;background:#5B4BA6}
.doc.VF{color:#fff;background:#1F7A8C}
.doc.其他{color:var(--ink-2);background:var(--grey-soft)}
.pc{display:inline-block;font:600 12px/1 var(--sans);padding:3px 7px;border-radius:10px;white-space:nowrap;border:1px solid var(--green);color:var(--green)}
.pc.w1{background:var(--green);color:var(--sheet)}
.pc.w2{background:var(--green-soft)}
.controls .lbl{font-size:14px;color:var(--ink-2)}
.qs{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.qs.qip{background:var(--blue)} .qs.qrv{background:#7B5FD0} .qs.qot{background:var(--grey)}
.pill.qip{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.pill.qrv{color:#7B5FD0;border-color:#7B5FD0}
.overdue{color:var(--amber);font-weight:600}
.controls label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2);cursor:pointer}
.tbl{overflow-x:auto;background:var(--sheet);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{white-space:nowrap;font:600 15px var(--cond);color:var(--ink-2);background:var(--paper);position:sticky;top:0}
th button{all:unset;cursor:pointer}
th button[data-dir]::after{content:attr(data-dir);margin-left:4px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--paper)}
tr.row.has-new td:first-child{box-shadow:inset 4px 0 0 var(--amber)}
td.story a{font-weight:600}
td.story div{overflow-wrap:anywhere}
td.rel{font-size:13px;color:var(--ink-2);max-width:220px}
.ladder{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ladder .arrow{color:var(--line);font-size:12px}
td.date{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.detail td{background:var(--paper);padding:0}
.det{padding:6px 12px 12px 28px}
.det table{min-width:0;background:var(--sheet);border:1px solid var(--line)}
.det td{font-size:14px}
.det ul{margin:0;padding-left:16px;font-size:13px}
.det li{overflow-wrap:anywhere}
.det li.fresh{color:var(--amber);font-weight:500}
footer{margin-top:36px;color:var(--ink-2);font-size:13px}
@media (max-width:820px){
  .title{grid-template-columns:1fr}
  .title h1{border-right:0;border-bottom:2px solid var(--ink)}
  .headline{grid-template-columns:1fr}
  .day{grid-template-columns:1fr}
  .day > time{border-right:0;border-bottom:1px solid var(--line)}
  .day > time b{display:inline;margin-right:8px}
  .item{grid-template-columns:auto minmax(0,1fr)}
  .item .pill{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:no-preference){ tr.detail .det{animation:open .18s ease-out} @keyframes open{from{opacity:0;transform:translateY(-4px)}} }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1><span data-i18n="title">SYS2 文件釋出追蹤</span>
      <span class="lang" id="lang" role="group" aria-label="Language"><button data-l="zh">中文</button><button data-l="en">EN</button></span></h1>
    <div class="meta" id="meta"></div>
  </header>

  <nav class="tabs" data-i18n-aria="tabsAria" aria-label="頁籤">
    <a href="#list" id="tabListLink"><b data-i18n="tabList" style="font-weight:inherit">Story 清單</b><span id="tabListCount"></span></a>
    <a href="#new" id="tabNewLink"><b data-i18n="tabNew" style="font-weight:inherit">期間內的新文件</b><span id="tabNewCount"></span></a>
    <a href="#polarion" id="tabQueueLink"><b data-i18n="tabQueue" style="font-weight:inherit">Polarion 處理中</b><span id="tabQueueCount"></span></a>
  </nav>

  <section id="tabNew" hidden>
  <div class="period">
    <span data-i18n="periodLbl">新文件的判定期間</span>
    <div class="seg" id="period" role="group" data-i18n-aria="periodAria" aria-label="期間">
      <button data-d="7"></button><button data-d="14"></button><button data-d="30"></button><button data-d="60"></button>
    </div>
  </div>

  <section class="headline">
    <p id="headline"></p>
    <figure class="spark" id="spark"></figure>
  </section>

  <h2><span data-i18n="feedH">期間內的新文件</span> <span class="count" id="feedCount"></span></h2>
  <div class="feed" id="feed"></div>
  </section>

  <section id="tabList">
  <h2><span data-i18n="listH">所有含 BL 的 Story</span> <span class="count" id="tblCount"></span></h2>
  <div class="controls">
    <div class="types" id="types" role="group" data-i18n-aria="typesAria" aria-label="文件類型"></div>
    <input type="search" id="q" data-i18n-ph="search" placeholder="搜尋 Story、BL 名稱、檔名或 key">
    <select id="rel" aria-label="Release"></select>
    <select id="st" data-i18n-aria="stAria" aria-label="BL 狀態">
      <option value="" data-i18n="stAll">全部 BL 狀態</option>
      <option value="open" data-i18n="stOpen">還有未完成的 BL</option>
      <option value="done" data-i18n="stDone">BL 全部完成</option>
    </select>
  </div>
  <div class="controls">
    <span class="lbl">Polarion checked</span>
    <div class="types" id="pcFilter" role="group" data-i18n-aria="pcAria" aria-label="Polarion checked 期間"></div>
  </div>
  <div class="tbl">
    <table>
      <thead><tr>
        <th><button data-sort="doc" data-dir="▲" data-i18n="thStory">Story(依文件編號)</button></th>
        <th>Release</th>
        <th id="thBL"></th>
        <th><button data-sort="last" data-i18n="thLast">最新 BL 建立</button></th>
        <th><button data-sort="file" data-i18n="thFile">最新附件</button></th>
        <th><button data-sort="pc" data-i18n="thPc">最近 Polarion checked</button></th>
        <th data-i18n="thStatus">Story 狀態</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  </section>

  <section id="tabQueue" hidden>
  <h2><span data-i18n="queueH">Polarion 處理中的項目</span> <span class="count" id="qCount"></span></h2>
  <div class="controls">
    <div class="types" id="qFilter" role="group" data-i18n-aria="qAria" aria-label="Polarion 狀態"></div>
    <a class="lbl" id="qSrc" target="_blank" rel="noopener"></a>
  </div>
  <div class="tbl">
    <table>
      <thead><tr>
        <th data-i18n="qTicket">Ticket</th>
        <th data-i18n="qStory">所屬 Story</th>
        <th data-i18n="qStatus">狀態</th>
        <th data-i18n="qOwner">負責人</th>
        <th data-i18n="qSince">進入此狀態</th>
        <th data-i18n="qDays">停留天數</th>
        <th data-i18n="qDue">Due</th>
        <th data-i18n="qUpdated">最後更新</th>
      </tr></thead>
      <tbody id="qBody"></tbody>
    </table>
  </div>
  </section>
  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const browse = k => `https://${DATA.site}/browse/${k}`;
const REF = new Date(DATA.generated);
const day = iso => iso ? iso.slice(0,10) : "";
const md = iso => iso ? `${+iso.slice(5,7)}/${+iso.slice(8,10)}` : "";
const blLabel = b => b.bl != null ? "BL" + (Number.isInteger(b.bl) ? b.bl : b.bl) : DATA.keyword;
const I18N = {
  zh: {
    tabQueue:"Polarion 處理中", queueH:"Polarion 處理中的項目", qAria:"Polarion 狀態", qTicket:"Ticket", qStory:"所屬 Story",
    qStatus:"狀態", qOwner:"負責人", qSince:"進入此狀態", qDays:"停留天數", qDue:"Due", qUpdated:"最後更新",
    qDaysN:n=>`${n} 天`, qOpen:j=>`在 Jira 開啟 ${j}`, qEmpty:"目前沒有項目。",
    title:"SYS2 文件釋出追蹤", tabsAria:"頁籤", tabList:"Story 清單", tabNew:"期間內的新文件",
    periodLbl:"新文件的判定期間", periodAria:"期間", days:n=>`${n} 天`,
    feedH:"期間內的新文件", listH:"所有含 BL 的 Story", typesAria:"文件類型",
    search:"搜尋 Story、BL 名稱、檔名或 key", stAria:"BL 狀態", stAll:"全部 BL 狀態", stOpen:"還有未完成的 BL", stDone:"BL 全部完成",
    pcAria:"Polarion checked 期間", thStory:"Story(依文件編號)", thBL:n=>`BL 版次(依版次排序，黃框為近 ${n} 天新增)`,
    thLast:"最新 BL 建立", thFile:"最新附件", thPc:"最近 Polarion checked", thStatus:"Story 狀態",
    pcW1:"1 週內", pcWn:w=>`第 ${w} 週`, pcAny:"不限", pcPast:w=>`過去 ${w} 週`,
    metaSrc:"來源", metaCond:"條件", cond:k=>`Story 下有名稱含「${k}」的 sub-task`, metaTime:"資料時間", tz:"（台北時間）",
    headline:(p,ns,nb,no,nf,tot,ft)=>`過去 ${p} 天，<span class="n">${ns}</span> 個 Story 有新文件，其中新增 <span class="n">${nb}</span> 份 BL。<small>新 BL 裡有 ${no} 份仍在進行中；BL sub-task 上共新增 ${nf} 個附件。統計範圍是 ${tot} 個含 BL sub-task 的 Story（filter 共 ${ft} 個 Story）。</small>`,
    headlineNone:p=>`過去 ${p} 天沒有新的 BL 文件。<small>可以把期間拉長，或到「Story 清單」查看每個 Story 的最新版次。</small>`,
    barTitle:v=>`${v} 份 BL`, sparkAgo:"12 週前", sparkNow:"本週", sparkCap:"每週新建 BL 數（黃色為所選期間）", sparkAria:"每週新 BL 數量",
    feedCount:n=>`${n} 筆`, feedEmpty:"這段期間沒有新的 BL 或附件。可切換到 30 或 60 天。",
    wd:["週日","週一","週二","週三","週四","週五","週六"],
    newBL:d=>`新 BL（${d} 建立）`, oldBL:"既有 BL 新增附件", belongs:"，屬於 ", owner:n=>`，負責人 ${n}`,
    moreFiles:n=>`還有 ${n} 個附件`, noFiles:"尚無附件", typeAll:"全部", typeOther:"其他", relAll:"全部 Release",
    created:"建立 ", sep:"，", fileDate:d=>`（${d}）`,
    noRows:"沒有符合條件的 Story。清除搜尋字或放寬篩選條件即可。",
    otherChecks:"其他 sub-task 近 4 週 Polarion checked：",
    foot:p=>`判定方式：「新文件」指在所選期間內建立的 BL sub-task，或在期間內上傳到 BL sub-task 的附件。「Polarion checked」指 Story 底下任一 sub-task 轉為「${p}」狀態的時間，過去 N 週即資料時間往回 N×7 天。期間都從資料時間往回算。BL 名稱比對區分大小寫。Jira 連結需登入公司帳號才能開啟。`
  },
  en: {
    tabQueue:"In Polarion", queueH:"Items in Polarion", qAria:"Polarion status", qTicket:"Ticket", qStory:"Parent Story",
    qStatus:"Status", qOwner:"Assignee", qSince:"In this status since", qDays:"Days in status", qDue:"Due", qUpdated:"Last updated",
    qDaysN:n=>`${n} ${n===1?"day":"days"}`, qOpen:j=>`Open ${j} in Jira`, qEmpty:"Nothing here right now.",
    title:"SYS2 Document Release Tracker", tabsAria:"Tabs", tabList:"Story list", tabNew:"New documents",
    periodLbl:"Look-back period for new documents", periodAria:"Period", days:n=>`${n} days`,
    feedH:"New documents in the period", listH:"All Stories with a BL sub-task", typesAria:"Document type",
    search:"Search Story, BL name, file name or key", stAria:"BL status", stAll:"All BL statuses", stOpen:"Has an open BL", stDone:"All BLs finished",
    pcAria:"Polarion checked period", thStory:"Story (by document no.)", thBL:n=>`BL versions (amber = new in ${n} days)`,
    thLast:"Latest BL created", thFile:"Latest attachment", thPc:"Last Polarion checked", thStatus:"Story status",
    pcW1:"Within 1 wk", pcWn:w=>`Week ${w}`, pcAny:"Any time", pcPast:w=>`Last ${w} wk${w>1?"s":""}`,
    metaSrc:"Source", metaCond:"Condition", cond:k=>`Story has a sub-task whose name contains "${k}"`, metaTime:"Data as of", tz:" (Taipei time)",
    headline:(p,ns,nb,no,nf,tot,ft)=>`In the last ${p} days, <span class="n">${ns}</span> ${ns===1?"Story":"Stories"} got new documents, including <span class="n">${nb}</span> new ${nb===1?"BL":"BLs"}.<small>${no} of the new BLs are still open; ${nf} attachments were added to BL sub-tasks. Scope: ${tot} Stories with a BL sub-task (${ft} Stories in the filter).</small>`,
    headlineNone:p=>`No new BL documents in the last ${p} days.<small>Try a longer period, or check each Story's latest BL in the Story list.</small>`,
    barTitle:v=>`${v} BL`, sparkAgo:"12 wks ago", sparkNow:"This week", sparkCap:"New BLs per week (amber = selected period)", sparkAria:"New BLs per week",
    feedCount:n=>`${n} ${n===1?"item":"items"}`, feedEmpty:"No new BLs or attachments in this period. Try 30 or 60 days.",
    wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    newBL:d=>`New BL (created ${d})`, oldBL:"New attachment on an existing BL", belongs:", in ", owner:n=>`, owner ${n}`,
    moreFiles:n=>`${n} more ${n===1?"attachment":"attachments"}`, noFiles:"No attachments", typeAll:"All", typeOther:"Other", relAll:"All releases",
    created:"Created ", sep:", ", fileDate:d=>` (${d})`,
    noRows:"No Stories match. Clear the search or loosen the filters.",
    otherChecks:"Other sub-tasks Polarion checked in the last 4 weeks: ",
    foot:p=>`How this works: "new documents" are BL sub-tasks created in the selected period, or attachments uploaded to a BL sub-task in that period. "Polarion checked" is the time any sub-task of the Story moved to the "${p}" status; "last N weeks" means N×7 days back. All periods count back from the data time. BL name matching is case-sensitive. Jira links need a company login.`
  }
};
function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "zh" || q === "en") return q;
  try { const s = localStorage.getItem("sys2-lang"); if (s === "zh" || s === "en") return s; } catch(e) {}
  return /^zh/i.test(navigator.language || "") ? "zh" : "en";
}
let LANG = pickLang();
const t = (k, ...a) => { const v = I18N[LANG][k]; return typeof v === "function" ? v(...a) : v; };

const ALLOWED = [7,14,30,60];
let period = 14;
let pcWeeks = 0;   // 0 = no Polarion filter, 1..4 = checked within that many weeks
let sort = {by:"doc", dir:1};
let docType = "";
const TYPES = ["CFTS","VF","其他"];
const open = new Set();

function cutoff(){ return new Date(REF.getTime() - period*864e5); }
function isNew(iso){ return iso && new Date(iso) >= cutoff(); }

function decorate(){
  for (const s of DATA.stories){
    s.lastBL = s.bls[s.bls.length-1];
    s.order = [TYPES.indexOf(s.doc.type), s.doc.no, s.doc.ver, s.doc.part, s.summary.toLowerCase(), +s.key.split("-").pop()];
    s.lastCreated = s.bls.reduce((m,b)=> b.created > m ? b.created : m, "");
    s.lastFile = s.bls.flatMap(b=>b.files).reduce((m,f)=> f.created > m ? f.created : m, "");
    s.openCount = s.bls.filter(b=>b.state==="open").length;
    s.lastCheck = s.checks.length ? s.checks[0].when : "";
    s.pcWeek = weekOf(s.lastCheck);
    s.text = [s.key,s.summary,s.release,s.assignee,...s.bls.flatMap(b=>[b.key,b.summary,b.assignee,...b.files.map(f=>f.name)])].join(" ").toLowerCase();
  }
}
// 1 = within the last 7 days, 2 = 8-14 days ago ... ; 0 = none or older than 4 weeks
function weekOf(iso){
  if (!iso) return 0;
  const days = (REF.getTime() - new Date(iso).getTime())/864e5;
  const w = Math.max(1, Math.ceil(days/7));
  return w <= 4 ? w : 0;
}
function pcBadge(iso, w){
  return w ? `<span class="pc w${w}" title="${esc(iso.replace("T"," ").slice(0,16))}">${w===1?t("pcW1"):t("pcWn",w)}</span>` : "";
}

function fresh(s){
  const bls = s.bls.filter(b=>isNew(b.created));
  const files = s.bls.flatMap(b=>b.files.filter(f=>isNew(f.created)));
  return {bls, files, any: bls.length>0 || files.length>0};
}

function renderMeta(){
  const g = new Date(DATA.generated);
  $("#meta").innerHTML = `
    <div>${t("metaSrc")}</div><div><a href="https://${esc(DATA.site)}/issues/?jql=${encodeURIComponent(DATA.jql)}" target="_blank" rel="noopener">${esc(DATA.jql)}</a></div>
    <div>${t("metaCond")}</div><div>${t("cond", esc(DATA.keyword))}</div>
    <div>${t("metaTime")}</div><div>${esc(DATA.generated.replace("T"," ").slice(0,16))}${t("tz")}</div>`;
}

function renderHeadline(){
  const all = DATA.stories.map(s=>({s, f:fresh(s)}));
  const nBL = all.reduce((n,x)=>n+x.f.bls.length,0);
  const nStory = all.filter(x=>x.f.any).length;
  const nOpen = all.reduce((n,x)=>n+x.f.bls.filter(b=>b.state==="open").length,0);
  const nFile = all.reduce((n,x)=>n+x.f.files.length,0);
  $("#headline").innerHTML = nStory
    ? t("headline", period, nStory, nBL, nOpen, nFile, DATA.stories.length, DATA.filterStories)
    : t("headlineNone", period);
}

function renderSpark(){
  const weeks = 12, W = 316, H = 80, bw = W/weeks;
  const counts = Array(weeks).fill(0);
  const end = REF.getTime();
  for (const s of DATA.stories) for (const b of s.bls){
    const age = Math.floor((end - new Date(b.created).getTime())/(7*864e5));
    if (age>=0 && age<weeks) counts[weeks-1-age]++;
  }
  const max = Math.max(1,...counts), c = cutoff().getTime();
  let bars = "";
  counts.forEach((v,i)=>{
    const h = Math.round((H-18)*v/max), x = i*bw+2, y = H-14-h;
    const weekEnd = end - (weeks-1-i)*7*864e5;
    bars += `<rect class="bar ${weekEnd > c ? "in":""}" x="${x}" y="${y}" width="${bw-4}" height="${Math.max(h,1)}"><title>${t("barTitle", v)}</title></rect>`;
    if (v) bars += `<text x="${x+(bw-4)/2}" y="${y-3}" text-anchor="middle">${v}</text>`;
  });
  bars += `<text x="0" y="${H-1}">${t("sparkAgo")}</text><text x="${W}" y="${H-1}" text-anchor="end">${t("sparkNow")}</text>`;
  $("#spark").innerHTML = `<figcaption>${t("sparkCap")}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("sparkAria")}">${bars}</svg>`;
}

function renderFeed(){
  // one entry per BL sub-task that is new itself or got new files in the period
  const entries = [];
  for (const s of DATA.stories) for (const b of s.bls){
    const nb = isNew(b.created), nf = b.files.filter(f=>isNew(f.created));
    if (!nb && !nf.length) continue;
    const when = [nb ? b.created : "", ...nf.map(f=>f.created)].sort().pop();
    entries.push({s,b,nb,nf,when});
  }
  entries.sort((a,b)=> a.when < b.when ? 1 : -1);
  $("#feedCount").textContent = entries.length ? t("feedCount", entries.length) : "";
  if (!entries.length){ $("#feed").innerHTML = `<div class="empty">${t("feedEmpty")}</div>`; return; }
  const byDay = new Map();
  for (const e of entries){ const d = day(e.when); if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(e); }
  const wd = t("wd");
  let html = "";
  for (const [d, list] of byDay){
    const wday = wd[new Date(d+"T12:00:00+08:00").getUTCDay()];
    html += `<div class="day"><time datetime="${d}"><b>${md(d)}</b>${wday}</time><div class="items">`;
    for (const {s,b,nb,nf} of list){
      const files = (nb ? b.files : nf).slice(0,6);
      const more = (nb ? b.files.length : nf.length) - files.length;
      html += `<div class="item">
        <span class="bl ${b.state}" title="${esc(b.status)}">${esc(blLabel(b))}</span>
        <div class="what">
          <a class="k" href="${browse(b.key)}" target="_blank" rel="noopener">${esc(b.key)}</a> ${esc(b.summary)}
          <div class="sub">${nb ? t("newBL", md(b.created)) : t("oldBL")}${t("belongs")}<a href="${browse(s.key)}" target="_blank" rel="noopener">${esc(s.key)}</a> ${esc(s.summary)}${b.assignee ? t("owner", esc(b.assignee)) : ""}</div>
          ${files.length ? `<ul>${files.map(f=>`<li class="${isNew(f.created)?"fresh":""}">${esc(f.name)} <span class="sub">${md(f.created)}${f.author?` ${esc(f.author)}`:""}</span></li>`).join("")}${more>0?`<li>${t("moreFiles", more)}</li>`:""}</ul>` : `<div class="sub">${t("noFiles")}</div>`}
        </div>
        <span class="pill ${b.state}">${esc(b.status)}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  $("#feed").innerHTML = html;
}

function renderTypes(){
  const n = ty => DATA.stories.filter(s=>!ty || s.doc.type===ty).length;
  $("#types").innerHTML = ["",...TYPES].filter(ty=>!ty || n(ty)).map(ty=>
    `<button data-t="${ty}" aria-pressed="${ty===docType}">${!ty ? t("typeAll") : ty==="其他" ? t("typeOther") : ty}<span>${n(ty)}</span></button>`).join("");
}

function renderPcFilter(){
  const n = w => DATA.stories.filter(s=>s.pcWeek && s.pcWeek<=w).length;
  $("#pcFilter").innerHTML = [0,1,2,3,4].map(w=>
    `<button data-w="${w}" aria-pressed="${w===pcWeeks}">${w? `${t("pcPast", w)}<span>${n(w)}</span>` : t("pcAny")}</button>`).join("");
}

function renderRelOptions(){
  const rels = [...new Set(DATA.stories.map(s=>s.release))].sort();
  const keep = $("#rel").value;
  $("#rel").innerHTML = `<option value="">${t("relAll")}</option>` + rels.map(r=>`<option>${esc(r)}</option>`).join("");
  $("#rel").value = keep;
}

function renderTable(){
  const q = $("#q").value.trim().toLowerCase(), rel = $("#rel").value, st = $("#st").value;
  let rows = DATA.stories.map(s=>({s, f:fresh(s)})).filter(({s,f})=>
    (!q || s.text.includes(q)) && (!rel || s.release===rel) && (!docType || s.doc.type===docType) &&
    (!st || (st==="open" ? s.openCount>0 : s.openCount===0)) && (!pcWeeks || (s.pcWeek && s.pcWeek<=pcWeeks)));
  const cmp = (A,B) => { if (Array.isArray(A)) { for (let i=0;i<A.length;i++){ const c=cmp(A[i],B[i]); if(c) return c; } return 0; } return A<B?-1:A>B?1:0; };
  const key = {doc:x=>x.s.order, last:x=>x.s.lastCreated, file:x=>x.s.lastFile, pc:x=>x.s.lastCheck}[sort.by];
  rows.sort((a,b)=> cmp(key(a),key(b))*sort.dir || cmp(a.s.order,b.s.order));
  $("#tblCount").textContent = `${rows.length} / ${DATA.stories.length}`;
  document.querySelectorAll("th button").forEach(b=>{ if(b.dataset.sort===sort.by) b.dataset.dir = sort.dir<0?"▼":"▲"; else delete b.dataset.dir; });
  let html = "";
  for (const {s,f} of rows){
    const ladder = s.bls.map((b,i)=>`${i?'<span class="arrow" aria-hidden="true">›</span>':""}<span class="bl ${b.state} ${isNew(b.created)?"new":""}" title="${esc(b.key)} ${esc(b.status)}\n${esc(b.summary)}">${esc(blLabel(b))}</span>`).join("");
    html += `<tr class="row ${f.any?"has-new":""}" data-k="${esc(s.key)}" tabindex="0" aria-expanded="${open.has(s.key)}">
      <td class="story">${s.doc.label?`<span class="doc ${s.doc.type}">${esc(s.doc.label)}</span>`:""}<a href="${browse(s.key)}" target="_blank" rel="noopener">${esc(s.key)}</a><div>${esc(s.summary)}</div></td>
      <td class="rel">${esc(s.release)}</td>
      <td><div class="ladder">${ladder}</div></td>
      <td class="date">${esc(day(s.lastCreated))}</td>
      <td class="date">${esc(day(s.lastFile)) || "—"}</td>
      <td class="date">${s.lastCheck ? `${esc(day(s.lastCheck))} ${pcBadge(s.lastCheck, s.pcWeek)}` : "—"}</td>
      <td><span class="pill">${esc(s.status)}</span></td></tr>`;
    if (open.has(s.key)){
      html += `<tr class="detail"><td colspan="7"><div class="det"><table><tbody>${[...s.bls].reverse().map(b=>`
        <tr><td style="width:64px"><span class="bl ${b.state} ${isNew(b.created)?"new":""}">${esc(blLabel(b))}</span></td>
        <td><a href="${browse(b.key)}" target="_blank" rel="noopener">${esc(b.key)}</a> ${esc(b.summary)}<div class="sub" style="color:var(--ink-2);font-size:13px">${t("created")}${esc(b.created.replace("T"," ").slice(0,16))}${b.assignee?`${t("sep")}${esc(b.assignee)}`:""}</div></td>
        <td style="width:150px"><span class="pill ${b.state}">${esc(b.status)}</span>${b.checked?`<div style="font-size:12px;color:var(--ink-2);margin-top:4px">checked ${esc(day(b.checked))} ${pcBadge(b.checked, weekOf(b.checked))}</div>`:""}</td>
        <td>${b.files.length?`<ul>${b.files.map(f=>`<li class="${isNew(f.created)?"fresh":""}">${esc(f.name)}${t("fileDate", md(f.created))}</li>`).join("")}</ul>`:`<span style="color:var(--ink-2)">${t("noFiles")}</span>`}</td></tr>`).join("")}
      </tbody></table>${otherChecks(s)}</div></td></tr>`;
    }
  }
  $("#tbody").innerHTML = html || `<tr><td colspan="7" class="empty">${t("noRows")}</td></tr>`;
}

// non-BL sub-tasks checked in the last 4 weeks (BL ones are shown in the table above)
function otherChecks(s){
  const bl = new Set(s.bls.map(b=>b.key));
  const list = s.checks.filter(c=>!bl.has(c.key) && weekOf(c.when));
  if (!list.length) return "";
  return `<div style="margin-top:8px;font-size:13px;color:var(--ink-2)">${t("otherChecks")}${list.map(c=>`<div><a href="${browse(c.key)}" target="_blank" rel="noopener">${esc(c.key)}</a> ${esc(c.summary)} ${esc(day(c.when))} ${pcBadge(c.when, weekOf(c.when))}</div>`).join("")}</div>`;
}

function showTab(){
  const tab = location.hash === "#new" ? "new" : location.hash === "#polarion" ? "queue" : "list";
  for (const [id, name] of [["New","new"],["List","list"],["Queue","queue"]]){
    $("#tab"+id).hidden = tab !== name;
    $("#tab"+id+"Link").setAttribute("aria-current", tab===name ? "page" : "false");
  }
}

// ---- Polarion tab: a flat list of the issues in the second filter, tagged by status
let qStatus = "";
function queueStatuses(){
  const extra = [...new Set(DATA.queue.map(q=>q.status))].filter(x=>!DATA.queueStatuses.includes(x));
  return [...DATA.queueStatuses, ...extra];
}
function qClass(st){ const i = DATA.queueStatuses.indexOf(st); return i===0 ? "qip" : i===1 ? "qrv" : "qot"; }
function renderQueue(){
  const sts = queueStatuses();
  const n = st => DATA.queue.filter(q=>!st || q.status===st).length;
  $("#qFilter").innerHTML = ["",...sts].map(st=>
    `<button data-s="${esc(st)}" aria-pressed="${st===qStatus}">${st ? `<i class="qs ${qClass(st)}"></i>${esc(st)}` : t("typeAll")}<span>${n(st)}</span></button>`).join("");
  $("#qSrc").href = `https://${DATA.site}/issues/?jql=${encodeURIComponent(DATA.queueJql)}`;
  $("#qSrc").textContent = t("qOpen", DATA.queueJql);
  $("#qCount").textContent = DATA.queue.length;
  $("#tabQueueCount").textContent = DATA.queue.length;
  const today = DATA.generated.slice(0,10);
  const rows = DATA.queue.filter(q=>!qStatus || q.status===qStatus)
    .sort((a,b)=> sts.indexOf(a.status)-sts.indexOf(b.status) || (a.since||a.updated).localeCompare(b.since||b.updated));
  $("#qBody").innerHTML = rows.map(q=>{
    const days = q.since ? Math.floor((REF - new Date(q.since))/864e5) : null;
    return `<tr>
      <td class="story">${q.doc.label ? `<span class="doc ${q.doc.type}">${esc(q.doc.label)}</span>` : ""}<a href="${browse(q.key)}" target="_blank" rel="noopener">${esc(q.key)}</a><div>${esc(q.summary)}</div></td>
      <td class="rel">${q.parent ? `<a href="${browse(q.parent)}" target="_blank" rel="noopener">${esc(q.parent)}</a> ${esc(q.parentSummary)}` : "—"}</td>
      <td><span class="pill ${qClass(q.status)}">${esc(q.status)}</span></td>
      <td>${esc(q.assignee) || "—"}</td>
      <td class="date">${q.since ? esc(q.since.replace("T"," ").slice(0,16)) : "—"}</td>
      <td class="date">${days==null ? "—" : t("qDaysN", days)}</td>
      <td class="date ${q.due && q.due < today ? "overdue" : ""}">${esc(q.due) || "—"}</td>
      <td class="date">${esc(day(q.updated))}</td></tr>`;
  }).join("") || `<tr><td colspan="8" class="empty">${t("qEmpty")}</td></tr>`;
}

function renderAll(){
  document.querySelectorAll("#period button").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.d===period));
  document.querySelectorAll("#period button").forEach(b=>b.textContent = t("days", +b.dataset.d));
  $("#thBL").textContent = t("thBL", period);
  renderHeadline(); renderSpark(); renderFeed(); renderTable();
  $("#tabListCount").textContent = DATA.stories.length;
  $("#tabNewCount").textContent = $("#feedCount").textContent;
}

decorate(); applyLang(); showTab();
// static labels marked with data-i18n / data-i18n-ph / data-i18n-aria, plus everything drawn by JS
function applyLang(){
  document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===LANG));
  $("#foot").innerHTML = t("foot", esc(DATA.polarion));
  renderMeta(); renderTypes(); renderPcFilter(); renderRelOptions(); renderAll(); renderQueue();
}
$("#qFilter").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; qStatus=b.dataset.s; renderQueue(); });
$("#lang").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b || b.dataset.l === LANG) return;
  LANG = b.dataset.l;
  try { localStorage.setItem("sys2-lang", LANG); } catch(err) {}
  const u = new URL(location.href); u.searchParams.set("lang", LANG); history.replaceState(null, "", u);
  applyLang();
});

$("#period").addEventListener("click", e=>{ const d=+e.target.dataset.d; if(!d) return; period=d; renderAll(); });
window.addEventListener("hashchange", showTab);
$("#pcFilter").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; pcWeeks=+b.dataset.w; renderPcFilter(); renderTable(); });
$("#types").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; docType=b.dataset.t; renderTypes(); renderTable(); });
["#q","#rel","#st"].forEach(s=>$(s).addEventListener("input", renderTable));
document.querySelectorAll("th button").forEach(b=>b.addEventListener("click",()=>{ const by=b.dataset.sort; sort = {by, dir: sort.by===by ? -sort.dir : (by==="doc"?1:-1)}; renderTable(); }));
$("#tbody").addEventListener("click", e=>{ if(e.target.closest("a")) return; const tr=e.target.closest("tr.row"); if(!tr) return; const k=tr.dataset.k; open.has(k)?open.delete(k):open.add(k); renderTable(); });
$("#tbody").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches("tr.row")){ e.preventDefault(); e.target.click(); }});
</script>
